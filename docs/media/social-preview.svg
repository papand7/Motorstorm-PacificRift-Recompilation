  </g>
  <text x="80" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#f7f7f2">MotorStorm: Pacific Rift</text>
  <text x="84" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#cfe8df" letter-spacing="3">NATIVE PC RECOMPILATION · EXPERIMENTAL</text>
  <text x="84" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cfe8df" opacity="0.85">Static PPU/SPU recompilation · Direct3D 12 · user-supplied game data only</text>
