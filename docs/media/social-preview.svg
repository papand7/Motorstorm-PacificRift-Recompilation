<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="MotorStorm: Pacific Rift native PC recompilation">
  <!-- Original project artwork (T139), same motifs as banner.svg. Not derived from any official MotorStorm logo or
       game asset. GitHub's social preview needs a PNG/JPG upload: rasterise at 1280x640 before uploading. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
