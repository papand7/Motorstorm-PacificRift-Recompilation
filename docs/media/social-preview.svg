      <stop offset="1" stop-color="#c8553d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2618"/>
      <stop offset="1" stop-color="#140c07"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#sky)"/>
  <path d="M700 452 L880 230 L920 230 L1100 452 Z" fill="#241710" opacity="0.9"/>
  <path d="M880 230 Q900 180 920 230 Z" fill="#f28f3b" opacity="0.85"/>
  <path d="M0 470 Q220 420 460 450 T920 440 T1280 425 L1280 640 L0 640 Z" fill="url(#ground)"/>
  <g stroke="#f4a259" stroke-width="4" fill="none" opacity="0.55">
